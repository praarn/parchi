[project]
name = "parchi-api"
version = "1.0.0"
description = "Parchi API — auth, documents, RAG chat, live progress, and the document pipeline."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends()/File() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

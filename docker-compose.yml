services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bureaucracy
      POSTGRES_PASSWORD: bureaucracy
      POSTGRES_DB: bureaucracy
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  ai-service:
    build: ./fastapi-service
    restart: unless-stopped
    env_file:
      - ./fastapi-service/.env
    environment:
      DATABASE_URL: postgresql://bureaucracy:bureaucracy@postgres:5432/bureaucracy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres

  api:
    build: ./node-api
    restart: unless-stopped
    env_file:
      - ./node-api/.env
    environment:
      DATABASE_URL: postgresql://bureaucracy:bureaucracy@postgres:5432/bureaucracy
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /data/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
      - redis
      - ai-service

  worker:
    build: ./node-api
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - ./node-api/.env
    environment:
      DATABASE_URL: postgresql://bureaucracy:bureaucracy@postgres:5432/bureaucracy
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
      - redis
      - ai-service

  web:
    build: ./web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  uploads:
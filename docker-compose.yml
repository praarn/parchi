services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bureaucracy
      POSTGRES_PASSWORD: bureaucracy
      POSTGRES_DB: bureaucracy
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bureaucracy -d bureaucracy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://bureaucracy:bureaucracy@postgres:5432/bureaucracy
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    # The image's HTTP healthcheck is for the API; the worker has no server.
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://bureaucracy:bureaucracy@postgres:5432/bureaucracy
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is inlined into the client bundle at build time. The
      # browser talks to the API on the host, so these are localhost URLs.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  uploads:
